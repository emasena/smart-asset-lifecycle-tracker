<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="1" stop-color="#102d4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#ffbd59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#79c7ff"/>
    </marker>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="175" fill="#00a7e1" opacity=".07"/>
  <circle cx="85" cy="590" r="180" fill="#ff9900" opacity=".07"/>

  <text x="62" y="68" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">AWS Smart Asset Lifecycle Tracker</text>
  <text x="62" y="103" fill="#a9c9e6" font-family="Arial,Helvetica,sans-serif" font-size="18">Enterprise identity • Scoped machine access • Infrastructure as code</text>
  <rect x="62" y="121" width="310" height="5" rx="2" fill="url(#accent)"/>

  <!-- Human lane -->
  <text x="66" y="174" fill="#ffbd59" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">HUMAN ACCESS</text>
  <g filter="url(#shadow)">
    <rect x="62" y="193" width="170" height="92" rx="16" fill="#163a60" stroke="#2a5b85"/>
    <text x="147" y="228" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Employees</text>
    <text x="147" y="255" text-anchor="middle" fill="#b9d4e8" font-family="Arial" font-size="14">Admin • Auditor</text>
    <text x="147" y="274" text-anchor="middle" fill="#b9d4e8" font-family="Arial" font-size="14">Technician • User</text>

    <rect x="287" y="193" width="170" height="92" rx="16" fill="#0b78c4"/>
    <text x="372" y="229" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Okta</text>
    <text x="372" y="257" text-anchor="middle" fill="#dff3ff" font-family="Arial" font-size="14">OIDC federation</text>
    <text x="372" y="276" text-anchor="middle" fill="#dff3ff" font-family="Arial" font-size="14">Group mapping</text>

    <rect x="512" y="193" width="185" height="92" rx="16" fill="#6941c6"/>
    <text x="604" y="228" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Amazon Cognito</text>
    <text x="604" y="256" text-anchor="middle" fill="#eee8ff" font-family="Arial" font-size="14">Tokens + trusted roles</text>
    <text x="604" y="276" text-anchor="middle" fill="#eee8ff" font-family="Arial" font-size="14">Separation of duties</text>
  </g>

  <!-- Machine lane -->
  <text x="66" y="355" fill="#ffbd59" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">NON-HUMAN ACCESS</text>
  <g filter="url(#shadow)">
    <rect x="62" y="374" width="170" height="92" rx="16" fill="#163a60" stroke="#2a5b85"/>
    <text x="147" y="409" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Applications</text>
    <text x="147" y="437" text-anchor="middle" fill="#b9d4e8" font-family="Arial" font-size="14">Service accounts</text>
    <text x="147" y="456" text-anchor="middle" fill="#b9d4e8" font-family="Arial" font-size="14">Automated imports</text>

    <rect x="287" y="374" width="410" height="92" rx="16" fill="#214c72" stroke="#37709e"/>
    <text x="492" y="409" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">OAuth 2.0 Client Credentials</text>
    <text x="492" y="437" text-anchor="middle" fill="#cce4f7" font-family="Arial" font-size="14">asset-tracker/assets.read</text>
    <text x="492" y="457" text-anchor="middle" fill="#cce4f7" font-family="Arial" font-size="14">asset-tracker/assets.write</text>
  </g>

  <!-- Shared services -->
  <g filter="url(#shadow)">
    <rect x="768" y="193" width="165" height="273" rx="18" fill="#142f4e" stroke="#3c6c93"/>
    <text x="850" y="229" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">API Gateway</text>
    <rect x="790" y="252" width="121" height="36" rx="18" fill="#23547d"/>
    <text x="850" y="275" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">Human routes</text>
    <rect x="790" y="302" width="121" height="36" rx="18" fill="#23547d"/>
    <text x="850" y="325" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">/machine/assets</text>
    <rect x="790" y="352" width="121" height="36" rx="18" fill="#23547d"/>
    <text x="850" y="375" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">Scope checks</text>
    <rect x="790" y="402" width="121" height="36" rx="18" fill="#23547d"/>
    <text x="850" y="425" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">Least privilege</text>

    <rect x="995" y="193" width="150" height="118" rx="18" fill="#ff9900"/>
    <text x="1070" y="233" text-anchor="middle" fill="#172235" font-family="Arial" font-size="20" font-weight="700">AWS Lambda</text>
    <text x="1070" y="260" text-anchor="middle" fill="#2f3540" font-family="Arial" font-size="14">Authorization</text>
    <text x="1070" y="281" text-anchor="middle" fill="#2f3540" font-family="Arial" font-size="14">Business logic</text>

    <rect x="995" y="348" width="150" height="118" rx="18" fill="#357b55"/>
    <text x="1070" y="388" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="700">DynamoDB</text>
    <text x="1070" y="415" text-anchor="middle" fill="#e7fff1" font-family="Arial" font-size="14">Asset records</text>
    <text x="1070" y="436" text-anchor="middle" fill="#e7fff1" font-family="Arial" font-size="14">Lifecycle data</text>
  </g>

  <!-- arrows -->
  <path d="M232 239 H278" stroke="#79c7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M457 239 H503" stroke="#79c7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M697 239 H758" stroke="#79c7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M232 420 H278" stroke="#79c7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M697 420 H758" stroke="#79c7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M933 252 H985" stroke="#79c7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1070 311 V338" stroke="#79c7ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- footer -->
  <rect x="62" y="512" width="1083" height="70" rx="16" fill="#0c213b" stroke="#254a6b"/>
  <text x="90" y="543" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Operational controls</text>
  <text x="90" y="567" fill="#b9d4e8" font-family="Arial" font-size="14">CloudFormation + SAM</text>
  <text x="302" y="567" fill="#b9d4e8" font-family="Arial" font-size="14">CloudWatch alarms</text>
  <text x="500" y="567" fill="#b9d4e8" font-family="Arial" font-size="14">SQS dead-letter queue</text>
  <text x="724" y="567" fill="#b9d4e8" font-family="Arial" font-size="14">183 automated tests</text>
  <text x="926" y="567" fill="#8ff0b5" font-family="Arial" font-size="14" font-weight="700">0 drift • HTTP 200</text>
</svg>
