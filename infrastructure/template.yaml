AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Smart Asset Lifecycle Tracker - assets, photos, AI analysis and maintenance scheduling

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  AlertEmail:
    Type: String
    Default: ''
    Description: >-
      Email address to receive CloudWatch alarm notifications. Leave blank
      to skip creating the SNS subscription.
  MaintenanceNotificationEmail:
    Type: String
    Default: ''
    Description: Optional email address for maintenance alerts
  PendingUploadExpiration:
    Type: String
    Default: Disabled
    AllowedValues: [Enabled, Disabled]
    Description: >-
      Whether the S3 lifecycle rule that expires pending/ photos after 7 days
      is active. Keep Disabled on an existing environment until
      scripts/migrate_pending_photos.py --verify passes, then redeploy with
      Enabled (see docs/photo-storage-migration.md).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasMaintenanceNotificationEmail: !Not
    - !Equals
      - !Ref MaintenanceNotificationEmail
      - ''

Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]
    Timeout: 15
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        ASSET_TABLE_NAME: !Ref AssetTable
        LOG_LEVEL: INFO

Resources:
  MaintenanceNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub smart-asset-maintenance-${Environment}
      DisplayName: Smart Asset Maintenance
      KmsMasterKeyId: alias/aws/sns

  MaintenanceNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref MaintenanceNotificationTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sns:Publish
            Resource: !Ref MaintenanceNotificationTopic
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  MaintenanceEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasMaintenanceNotificationEmail
    Properties:
      Protocol: email
      Endpoint: !Ref MaintenanceNotificationEmail
      TopicArn: !Ref MaintenanceNotificationTopic

  AssetTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub smart-asset-tracker-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: assignedUserId
          AttributeType: S
        - AttributeName: department
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: AssignedUserIndex
          KeySchema:
            - AttributeName: assignedUserId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: DepartmentIndex
          KeySchema:
            - AttributeName: department
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AssetPhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-photos-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins:
              - https://main.dx980x98nt3d5.amplifyapp.com
              - http://localhost:5173
              - http://localhost:5180
            AllowedHeaders: ['*']
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUnclaimedPendingUploads
            Status: !Ref PendingUploadExpiration
            Prefix: pending/
            ExpirationInDays: 7

  AssetPhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetPhotoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AssetPhotoBucket.Arn
              - !Sub ${AssetPhotoBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub smart-asset-tracker-${Environment}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: department
          AttributeDataType: String
          Mutable: true
          Required: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub smart-asset-tracker-web-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
  EmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employee
      Description: View assigned assets and report problems
      UserPoolId: !Ref UserPool
      Precedence: 50
  TechnicianGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Technician
      Description: Create assets and update operational asset data
      UserPoolId: !Ref UserPool
      Precedence: 40
  ManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Manager
      Description: View department assets and reports
      UserPoolId: !Ref UserPool
      Precedence: 30
  AdministratorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Administrator
      Description: Full asset and user administration
      UserPoolId: !Ref UserPool
      Precedence: 10
  AuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Auditor
      Description: Read-only audit access
      UserPoolId: !Ref UserPool
      Precedence: 20
  AssetApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub smart-asset-tracker-${Environment}
      StageName: !Ref Environment
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: '401'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
          ResponseTemplates:
            application/json: '{"error":"Unauthorized","message":"Sign in to access this resource."}'
        ACCESS_DENIED:
          StatusCode: '403'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
          ResponseTemplates:
            application/json: '{"error":"Forbidden","message":"You do not have permission to perform this action."}'
  AssetApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-asset-api-${Environment}
      CodeUri: ../backend/asset_api/
      Handler: app.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          MAINTENANCE_MODEL_ID: us.amazon.nova-lite-v1:0
          ASSET_PHOTO_BUCKET: !Ref AssetPhotoBucket
      Policies:
        - Statement:
            - Sid: AssetTableReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:TransactWriteItems
              Resource: !GetAtt AssetTable.Arn
            - Sid: QueryAssetIndexes
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub '${AssetTable.Arn}/index/*'
            - Sid: ClaimPendingPhotos
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub ${AssetPhotoBucket.Arn}/pending/*
            - Sid: WriteClaimedPhotos
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub ${AssetPhotoBucket.Arn}/claimed/*
            - Sid: InvokeMaintenanceNovaLiteProfile
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0

            - Sid: InvokeMaintenanceNovaLiteModels
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-lite-v1:0
              Condition:
                StringEquals:
                  bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0
            - Sid: ReadAuthorizedAssetPhotos
              Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub ${AssetPhotoBucket.Arn}/pending/*
                - !Sub ${AssetPhotoBucket.Arn}/claimed/*
                - !Sub ${AssetPhotoBucket.Arn}/assets/*
      Events:
        CreateAsset:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets
            Method: POST
        ListAssets:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets
            Method: GET
        GetAsset:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets/{assetId}
            Method: GET
        GetAssetPhoto:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets/{assetId}/photo
            Method: GET
        UpdateAsset:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets/{assetId}
            Method: PUT
        CreateMaintenance:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets/{assetId}/maintenance
            Method: POST
        ListMaintenance:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets/{assetId}/maintenance
            Method: GET
        UpdateMaintenance:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets/{assetId}/maintenance/{maintenanceId}
            Method: PUT
        DeleteMaintenance:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets/{assetId}/maintenance/{maintenanceId}
            Method: DELETE
        GenerateMaintenanceRecommendation:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /assets/{assetId}/maintenance-recommendation
            Method: POST

  PhotoUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-asset-photo-upload-${Environment}
      CodeUri: ../backend/asset_api/
      Handler: photo_upload.lambda_handler
      Environment:
        Variables:
          ASSET_PHOTO_BUCKET: !Ref AssetPhotoBucket
      Policies:
        - Statement:
            - Sid: WritePendingPhotosOnly
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub ${AssetPhotoBucket.Arn}/pending/*
      Events:
        GetPhotoUploadForm:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /photo-uploads
            Method: POST

  PhotoAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-asset-photo-analysis-${Environment}
      CodeUri: ../backend/asset_api/
      Handler: photo_analysis.lambda_handler
      Timeout: 90
      MemorySize: 512
      Environment:
        Variables:
          ASSET_PHOTO_BUCKET: !Sub ${AWS::StackName}-photos-${AWS::AccountId}-${AWS::Region}
          PHOTO_MODEL_ID: us.amazon.nova-lite-v1:0
      # The bucket ARN is built from its name rather than !GetAtt because the
      # bucket's S3 event notification already depends on this function.
      Policies:
        - Statement:
            - Sid: ReadPendingPhotos
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}-${AWS::Region}/pending/*

            - Sid: SavePhotoAnalysis
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt AssetTable.Arn

            - Sid: InvokeNovaLiteProfile
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0

            - Sid: InvokeNovaLiteModels
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-lite-v1:0
              Condition:
                StringEquals:
                  bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0

      Events:
        NewAssetPhoto:
          Type: S3
          Properties:
            Bucket: !Ref AssetPhotoBucket
            Events: s3:ObjectCreated:Post
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: pending/

  PhotoAnalysisApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-asset-photo-analysis-api-${Environment}
      CodeUri: ../backend/asset_api/
      Handler: photo_analysis.api_handler
      Environment:
        Variables:
          ASSET_PHOTO_BUCKET: !Sub ${AWS::StackName}-photos-${AWS::AccountId}-${AWS::Region}
          PHOTO_MODEL_ID: us.amazon.nova-lite-v1:0
      Policies:
        - Statement:
            - Sid: ReadPhotoAnalysis
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt AssetTable.Arn
      Events:
        GetPhotoAnalysis:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /photo-analysis
            Method: GET
  MaintenanceSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-asset-maintenance-scheduler-${Environment}
      CodeUri: ../backend/asset_api/
      Handler: maintenance_scheduler.lambda_handler
      Timeout: 60
      Environment:
        Variables:
          MAINTENANCE_TOPIC_ARN: !Ref MaintenanceNotificationTopic
      Policies:
        - Statement:
            - Sid: ReadAssetsAndMaintenance
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
              Resource: !GetAtt AssetTable.Arn

            - Sid: PublishMaintenanceNotifications
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref MaintenanceNotificationTopic
      Events:
        DailyMaintenanceCheck:
          Type: Schedule
          Properties:
            Name: !Sub smart-asset-maintenance-daily-${Environment}
            Description: Daily asset maintenance and cleaning check
            Schedule: cron(0 13 * * ? *)
            Enabled: true
            # RetryPolicy covers EventBridge-to-Lambda delivery only. Events that
            # still cannot be delivered land in the dead-letter queue.
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
            DeadLetterConfig:
              Type: SQS
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-asset-health-${Environment}
      CodeUri: ../backend/health/
      Handler: app.lambda_handler
      Policies: []
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref AssetApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  # --- Monitoring -----------------------------------------------------
  # Explicit log groups (matching each function's auto-generated name) let
  # us set retention and alarms as part of the stack instead of a manual
  # post-deploy script. If a log group with the same name already exists
  # outside this stack (e.g. from an earlier deploy before this template
  # change), import it into the stack rather than deleting it, so its logs
  # are kept: see "Migrating an existing deployment" in
  # docs/cloudwatch-monitoring.md.

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub smart-asset-tracker-alerts-${Environment}

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Lambda auto-creates /aws/lambda/<function> on first invoke, so an existing
  # environment already has these groups. Do NOT delete them to make room for
  # this template: import them into the stack instead, which keeps their logs
  # (see "Migrating an existing deployment" in docs/cloudwatch-monitoring.md).
  # Retain keeps logs when the stack or a resource is deleted/replaced, and is
  # required for CloudFormation resource import.
  AssetApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-asset-api-${Environment}
      RetentionInDays: 30

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-asset-health-${Environment}
      RetentionInDays: 14

  PhotoUploadLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-asset-photo-upload-${Environment}
      RetentionInDays: 14

  PhotoAnalysisLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-asset-photo-analysis-${Environment}
      RetentionInDays: 30

  PhotoAnalysisApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-asset-photo-analysis-api-${Environment}
      RetentionInDays: 14

  MaintenanceSchedulerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/smart-asset-maintenance-scheduler-${Environment}
      RetentionInDays: 30

  AssetApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-asset-api-${Environment}-errors
      AlarmDescription: Asset API Lambda returned errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AssetApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  AssetApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-asset-api-${Environment}-throttles
      AlarmDescription: Asset API Lambda was throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AssetApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  MaintenanceSchedulerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-asset-maintenance-scheduler-${Environment}-errors
      AlarmDescription: >-
        Maintenance scheduler Lambda returned errors (it runs on a schedule,
        so failures are otherwise silent)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MaintenanceSchedulerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  PhotoUploadErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-asset-photo-upload-${Environment}-errors
      AlarmDescription: Photo upload Lambda returned errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PhotoUploadFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  PhotoAnalysisErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-asset-photo-analysis-${Environment}-errors
      AlarmDescription: >-
        Bedrock photo-analysis Lambda returned errors (this function runs
        asynchronously off an S3 event, so failures are otherwise silent)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PhotoAnalysisFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  PhotoAnalysisThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-asset-photo-analysis-${Environment}-throttles
      AlarmDescription: Bedrock photo-analysis Lambda was throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref PhotoAnalysisFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-asset-api-${Environment}-5xx
      AlarmDescription: API Gateway returned server errors
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub smart-asset-tracker-${Environment}
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  AssetTableReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-asset-read-throttles-${Environment}
      AlarmDescription: DynamoDB asset table reported read throttling
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref AssetTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MaintenanceNotificationTopic

  AssetTableWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-asset-write-throttles-${Environment}
      AlarmDescription: DynamoDB asset table reported write throttling
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref AssetTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MaintenanceNotificationTopic

  AssetLifecycleDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub smart-asset-lifecycle-${Environment}
      DashboardBody:
        Fn::Sub: |
          {
            "start": "-PT24H",
            "periodOverride": "inherit",
            "widgets": [
              {
                "type": "text",
                "x": 0,
                "y": 0,
                "width": 24,
                "height": 2,
                "properties": {
                  "markdown": "# Smart Asset Lifecycle Tracker\nSecurity, API, Lambda and DynamoDB monitoring"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 2,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Asset API Lambda",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stat": "Sum",
                  "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Invocations", "FunctionName", "${AssetApiFunction}"],
                    [".", "Errors", ".", "."],
                    [".", "Throttles", ".", "."]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 2,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Asset API Duration",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stat": "Average",
                  "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Duration", "FunctionName", "${AssetApiFunction}"]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 8,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "API Gateway Requests",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stat": "Sum",
                  "period": 300,
                  "metrics": [
                    ["AWS/ApiGateway", "Count", "ApiName", "smart-asset-tracker-${Environment}", "Stage", "${Environment}"],
                    [".", "4XXError", ".", ".", ".", "."],
                    [".", "5XXError", ".", ".", ".", "."]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 8,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Maintenance Scheduler",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stat": "Sum",
                  "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Invocations", "FunctionName", "${MaintenanceSchedulerFunction}"],
                    [".", "Errors", ".", "."]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 14,
                "width": 24,
                "height": 6,
                "properties": {
                  "title": "DynamoDB Asset Table",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stat": "Sum",
                  "period": 300,
                  "metrics": [
                    ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${AssetTable}"],
                    [".", "ConsumedWriteCapacityUnits", ".", "."],
                    [".", "ReadThrottleEvents", ".", "."],
                    [".", "WriteThrottleEvents", ".", "."]
                  ]
                }
              }
            ]
          }

Outputs:
  MaintenanceNotificationTopicArn:
    Description: SNS topic for maintenance notifications
    Value: !Ref MaintenanceNotificationTopic
  ApiUrl:
    Description: REST API base URL
    Value: !Sub https://${AssetApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AssetTableName:
    Value: !Ref AssetTable
  AssetPhotoBucketName:
    Description: Private asset photograph bucket
    Value: !Ref AssetPhotoBucket
  AlertsTopicArn:
    Description: SNS topic for CloudWatch alarm notifications
    Value: !Ref AlertsTopic
  CloudWatchDashboardName:
    Description: CloudWatch operational dashboard
    Value: !Ref AssetLifecycleDashboard
